name: Feature request
description: Suggest an enhancement to the public API or native behavior.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem this feature would solve. Keep the library small: Android Phone Number Hint + iOS autofill props.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What API or native behavior do you want?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
